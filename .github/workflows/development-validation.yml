name: Development validation

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependency
        run: python -m pip install psutil
      - name: Compile Python
        run: python -m compileall -q sysmon.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate installer syntax
        run: sh -n install.sh
